#YAML file for configuring main.py settings


# ============================================================
# Runtime settings
# ============================================================

run:
  parallel: true            # enable multiprocessing across file
  verbose: true             # detailed progress/logging


# ------------------------------------------------------------
# Data source templates
# ------------------------------------------------------------
data:
  #   {base}   -> experiment.base_path
  #   {expid}  -> experiment.id
  #   {year}   -> selection year (YYYY)
  #   {month}  -> selection month (MM)
  ioda:
    dir_template: "{base}/{expid}/jedi/obs/Y{year}/M{month}"
    file_time_format: "%Y%m%d_%Hz"
    file_pattern: "{instrument}.*.nc4"

  ods:
    dir_template: "{base}/{expid}/obs/Y{year}/M{month}/D{day}/H{hour}"
    file_time_format: "%Y%m%d_%Hz"
    file_pattern: "{expid}.diag_{instrument}.{file_time_format}.ods"

# ------------------------------------------------------------
# Experiment locations
# ------------------------------------------------------------
experiments:
  # - id: j54rp1
  #   file_type: "ioda"
  #   base_path: /Users/ltrayano/Desktop/Obsview/Obsview/python/data/IODA files
  #   label: "Control"          # shown in plot legends/titles

  - id: x0054
    file_type: "ods"
    base_path: /Users/ltrayano/Desktop/Obsview/Obsview/python/data/ODS files
    label: "Experiment"

# ------------------------------------------------------------
# Analysis selection
# ------------------------------------------------------------
selection:
  time_range:
    start: "2026-01-01 06"
    end:   "2026-01-01 18"
    
  #region: "global, nh, sh, tr"

  targets:
    # - instrument: iasi_metop-b
    #   varname: brightnessTemperature   
    #   level: 262

    # - instrument: atms_n20
    #   varname: brightnessTemperature   
    #   level: 13

    - instrument: sondes
      varname: windVector
      level: 300.0   #all   
      #region: "global"

  

  


 


# ------------------------------------------------------------
# Plot settings
# ------------------------------------------------------------
plots:
  statistics:   #(4 panel plot)
    enabled: true
    time_averaged: true       # average over the whole time_range

  time_series:
    enabled: false
    date_tick_interval_days: 2

  coverage_map:
    enabled: false
    projection: PlateCarree

  monitoring_map: 
    enabled: false
    projection: PlateCarree
    stat_type: "omb wo BC"

  comparison:
    enabled: false
    stat_type: "rms_omb"    #rms or std
    ratio_bounds: 0.15  #x axis range for comparison ratio (e.g. 0.15 = ±15%)


# ------------------------------------------------------------
# Output settings
# ------------------------------------------------------------
output:
  mode: show                  # 'save', 'show', or 'both'
  save_directory: /Users/ltrayano/Desktop/Obsview/Test Figures/output
  format: png                 # png | pdf | svg
  dpi: 300
  filename_template: "{exp}.{plot}.{instrument}.{start}-{end}"
  filename_lev_template: "{exp}.{plot}.L{level}.{instrument}.{start}-{end}"
