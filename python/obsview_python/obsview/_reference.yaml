#Main reference file to map:
  #IODA to ODS naming conventions
  #** Instrument/variable pairs to respective level sets 
  #Plot titles


level_sets:
  default_pressure: [5.0, 7.0, 10.0, 20.0, 30.0, 50.0, 70.0, 100.0, 150.0, 200.0, 250.0, 300.0, 400.0, 500.0, 700.0, 850.0, 925.0, 1000.0]
  lower_trop:   [300.0, 400.0, 500.0, 700.0, 850.0, 925.0, 1000.0]
  upper_trop:   [200.0,250.0,300.0,400.0,500.0,700.0,850.0,925.0,1000.0]

instruments:
  atms_n20: {title: "ATMS NOAA-20", obtype: radiance}
  sondes:   {title: "Radiosonde",   obtype: conventional}

variables:          # keyed by IODA varname
  brightnessTemperature: {kt: 40, title: "Brightness temperature"}
  airTemperature:        {kt: 44, title: "Upper air temperature"}
  specificHumidity:      {kt: 11, title: "Specific humidity"}



observations:       # one row per (instrument, variable) combination
  - {instrument: atms_n20, varname: brightnessTemperature, kx: 920, level_type: channel,  levels: "1-22"}
  - {instrument: sondes,   varname: airTemperature,        kx: 120, level_type: pressure, levels: std_pressure}
  - {instrument: sondes,   varname: specificHumidity,      kx: 120, level_type: pressure, levels: lower_trop}